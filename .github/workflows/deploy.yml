name: Deploy to Netlify

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'messages/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'next.config.*'
      - 'netlify.toml'
      - 'middleware.ts'
      - '.github/workflows/deploy.yml'
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger-netlify:
    name: Trigger Netlify Build Hook
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call Netlify Build Hook
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK_URL" ]; then
            echo "::notice::NETLIFY_BUILD_HOOK_URL secret is not set. Skipping auto-deploy. Go to Netlify → Site settings → Build & deploy → Build hooks → Add build hook, then paste the URL into GitHub repo → Settings → Secrets and variables → Actions → New repository secret → Name: NETLIFY_BUILD_HOOK_URL"
            exit 0
          fi
          echo "Triggering Netlify deploy via Build Hook..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -d '' "$NETLIFY_BUILD_HOOK_URL")
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "✅ Netlify deploy triggered successfully (HTTP $HTTP_CODE)."
            echo "Monitor: https://app.netlify.com/sites/your-site/deploys"
          else
            echo "::warning::Netlify Build Hook returned HTTP $HTTP_CODE. Check the hook URL in repo secrets."
            exit 0
          fi