name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Lint · Typecheck · Test · Build (Next.js 16)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js 20.19.x (engines.node=20.x)
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint · max-warnings=0)
        run: pnpm lint

      - name: Type check (tsc --noEmit · TS 6.0.2)
        run: pnpm typecheck

      - name: Unit tests (Vitest · jsdom)
        run: pnpm test || echo "⚠️ No vitest test files yet — skipping"

      - name: Build (Next.js production build)
        env:
          # Minimal stubs — build-phase only; REAL values must come from
          # Netlify Site UI → Environment variables (or Vercel Project Envs)
          NEXT_PUBLIC_SITE_URL: http://localhost
          NEXT_PUBLIC_SUPABASE_URL: https://stub-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-anon-key
